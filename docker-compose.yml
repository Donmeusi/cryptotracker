services:
  cryptotracker:
    build: .
    container_name: cryptotracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Optional: feste oeffentliche URL (z. B. https://crypto.example.de).
      # Leer lassen, damit die App die Origin aus den Proxy-Headern
      # (Host / X-Forwarded-Proto) ableitet. Fuer OIDC ist AUTH_URL Pflicht.
      AUTH_URL: ${AUTH_URL:-}
      NEXTAUTH_URL: ${AUTH_URL:-}
      # Pflicht. Kein Standardwert im Repo - sonst signiert jeder Container
      # mit demselben Schluessel.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: file:/data/cryptotracker.db
      # Admin-Freigabe für System-Endpunkte; ohne Eintrag gesperrt.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Optional: Selbst-Update ueber einen Host-Agenten. Siehe
      # docs/System-Updates-und-Branch-Wechsel.md. Ohne die beiden Mounts
      # bleibt das Panel im Container ehrlich deaktiviert.
      CONTAINER_MODE: ${CONTAINER_MODE:-false}
      REPO_DIR: ${REPO_DIR:-/repo}
      UPDATE_DIR: ${UPDATE_DIR:-/update}
      UPDATE_REPO: ${UPDATE_REPO:-Donmeusi/cryptotracker}
    volumes:
      - cryptotracker_data:/data
      # - /pfad/zum/quellklon:/repo:ro
      # - /pfad/zum/update-verzeichnis:/update
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/anmelden').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  cryptotracker_data:
