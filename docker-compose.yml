services:
  cryptotracker:
    build: .
    container_name: cryptotracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Oeffentliche URL: fuer LAN die Host-IP, hinter einem Proxy die Domain.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${AUTH_URL:-http://localhost:3000}
      # Pflicht. Kein Standardwert im Repo - sonst signiert jeder Container
      # mit demselben Schluessel.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: file:/data/cryptotracker.db
      # Optional: Selbst-Update ueber einen Host-Agenten. Siehe
      # docs/System-Updates-und-Branch-Wechsel.md. Ohne die beiden Mounts
      # bleibt das Panel im Container ehrlich deaktiviert.
      CONTAINER_MODE: ${CONTAINER_MODE:-false}
      REPO_DIR: ${REPO_DIR:-/repo}
      UPDATE_DIR: ${UPDATE_DIR:-/update}
      UPDATE_REPO: ${UPDATE_REPO:-Donmeusi/cryptotracker}
    volumes:
      - cryptotracker_data:/data
      # - /pfad/zum/quellklon:/repo:ro
      # - /pfad/zum/update-verzeichnis:/update

volumes:
  cryptotracker_data:
