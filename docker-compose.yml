services:
  cryptotracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptotracker_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=super-secret-crypto-tracker-key-2026
      - DATABASE_URL=file:./prisma/cryptotracker.db
    volumes:
      - cryptotracker_data:/app/prisma

volumes:
  cryptotracker_data:
